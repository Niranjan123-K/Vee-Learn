server:
  port: ${PORT:5000}

spring:
  application:
    name: vee-learn-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/veelearn}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256!}
    expiration-ms: 86400000 # 24 hours
  credits:
    initial: ${INITIAL_CREDITS:3}
  cors:
    allowed-origin: ${CLIENT_URL:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:public/uploads}
  encryption:
    key: ${GOOGLE_ENCRYPTION_KEY:${JWT_SECRET:your-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256!}}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5000/api/google/callback}

socketio:
  host: 0.0.0.0
  port: 5001
